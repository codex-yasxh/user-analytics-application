name: CI

on:
  push:
    branches: [main, 'lane/*']
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL_TEST: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run check
        run: npm run check

      - name: Build tracker and check gzip budget
        run: |
          npm run --workspace=@cf/tracker build
          node -e "
            const fs = require('fs');
            const zlib = require('zlib');
            const raw = fs.readFileSync('dashboard/public/cf.js');
            const gz = zlib.gzipSync(raw).length;
            console.log('cf.js raw: ' + raw.length + ' bytes, gzip: ' + gz + ' bytes');
            if (gz > 5120) { console.error('FAIL: cf.js gzip exceeds 5 KB budget'); process.exit(1); }
          "

  fresh-clone:
    name: Fresh clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build tracker
        run: npm run --workspace=@cf/tracker build
